name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Setup debug keystore and dummy google-services if missing
        run: |
          # If debug.keystore is missing in CI runner root, create standard debug keystore
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure dummy google-services.json exists for CI if not provided
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"000000000000","project_id":"opencode-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.aistudio.opencode.agent"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4g -Djava.awt.headless=true\" -Djava.awt.headless=true"
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true -Dorg.gradle.parallel=false
          else
            gradle assembleDebug --no-daemon -Djava.awt.headless=true -Dorg.gradle.parallel=false
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
